  direct-nameserver:
    - 78.157.42.100
    - 78.157.42.101
  proxy-server-nameserver:
    - 2606:4700:4700::1111
    - 2606:4700:4700::1001
    - 2001:4860:4860::8888
    - 2001:4860:4860::8844
