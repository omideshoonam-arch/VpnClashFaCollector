proxy-groups:
  - name: نوع انتخاب پروکسی 🔀
    type: select
    proxies:
      - اتصال پایدار 🔗
      - خودکار (بهترین پینگ) 🤖
      - دستی 🤏🏻
      - پشتیبان (در صورت قطعی) 🧯
      - توزیع بار (پایدار) 🧲
      - توزیع بار (موقت) ⏳
      - توزیع بار (گردشی) 🔁
      - قطع اینترنت ⛔
      - بدون فیلترشکن 🛡️
  - name: دستی 🤏🏻
    type: select
    proxies:
      - 4🪞@oneclickvpnkeys
      - 2🪞@oneclickvpnkeys
      - 98@oneclickvpnkeys
      - 1🪞@oneclickvpnkeys
      - 99@oneclickvpnkeys
      - 3🪞@oneclickvpnkeys
      - 95@oneclickvpnkeys
      - 94@oneclickvpnkeys
      - 92@oneclickvpnkeys
      - 96@oneclickvpnkeys
      - 5🪞@oneclickvpnkeys`
  - name: خودکار (بهترین پینگ) 🤖
    type: url-test
    url: https://api.v2fly.org/checkConnection.svgz
    interval: 600
    tolerance: 50
    proxies:
      - 4🪞@oneclickvpnkeys
      - 2🪞@oneclickvpnkeys
      - 98@oneclickvpnkeys
      - 1🪞@oneclickvpnkeys
      - 99@oneclickvpnkeys
      - 3🪞@oneclickvpnkeys
      - 95@oneclickvpnkeys
      - 94@oneclickvpnkeys
      - 92@oneclickvpnkeys
      - 96@oneclickvpnkeys
      - 5🪞@oneclickvpnkeys`
  - name: پشتیبان (در صورت قطعی) 🧯
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    proxies:
      - 4🪞@oneclickvpnkeys
      - 2🪞@oneclickvpnkeys
      - 98@oneclickvpnkeys
      - 1🪞@oneclickvpnkeys
      - 99@oneclickvpnkeys
      - 3🪞@oneclickvpnkeys
      - 95@oneclickvpnkeys
      - 94@oneclickvpnkeys
      - 92@oneclickvpnkeys
      - 96@oneclickvpnkeys
      - 5🪞@oneclickvpnkeys`
  - name: اتصال پایدار 🔗
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    interval: 30
    tolerance: 50
    proxies:
      - خودکار (بهترین پینگ) 🤖
      - پشتیبان (در صورت قطعی) 🧯
      - دستی 🤏🏻
  - name: توزیع بار (پایدار) 🧲
    type: load-balance
    strategy: consistent-hashing
    url: https://api.v2fly.org/checkConnection.svgz
    interval: 600
    proxies:
      - 4🪞@oneclickvpnkeys
      - 2🪞@oneclickvpnkeys
      - 98@oneclickvpnkeys
      - 1🪞@oneclickvpnkeys
      - 99@oneclickvpnkeys
      - 3🪞@oneclickvpnkeys
      - 95@oneclickvpnkeys
      - 94@oneclickvpnkeys
      - 92@oneclickvpnkeys
      - 96@oneclickvpnkeys
      - 5🪞@oneclickvpnkeys`
  - name: توزیع بار (گردشی) 🔁
    type: load-balance
    strategy: consistent-hashing
